# Betriebsart „Hosting-Abo" (SaaS) – Override auf docker-compose.yml
#
# Start:
#   docker compose -f docker-compose.yml -f docker-compose.saas.yml up -d
#
# Anders als die Demo ist das KEIN eigener Stack, sondern dieselbe Anwendung
# wie beim Self-Hosting mit anderer Konfiguration. Genau so ist es im
# Betriebsmodell festgelegt: eine Codebasis, keine Funktionsunterschiede.
#
# ------------------------------------------------------------------------
# WICHTIG – was diese Datei NICHT leistet
#
# Sie macht aus dem Stack kein buchbares Produkt. Es fehlen weiterhin:
#   * Control Plane (Tarife, Abrechnung) – die Fachapp-Seite für
#     Bereitstellung und Sperren steht seit AP-4.4 unter
#     `/internal/control-plane` bereit, siehe
#     docs/control-plane-internal-api.md
#   * Objektspeicher für Belege – diese liegen weiterhin als Base64 in der
#     Datenbank (Audit 1 · B5). `STORAGE_DRIVER` existiert im Code NICHT.
#   * Offsite-Backups – `BACKUP_TARGET` existiert im Code NICHT.
#   * RLS und der Multiuser-Ablauf sind technisch sowie manuell nachgewiesen;
#     die CI wiederholt den Datenbankteil. SMTP-Zustellung, externe
#     Überwachung und die übrige manuelle Release-Checkliste bleiben offen.
#
# Hier stehen deshalb ausschließlich Schalter, die im Quelltext tatsächlich
# ausgewertet werden.
# ------------------------------------------------------------------------

services:
  backend:
    environment:
      # Sitzungscookies nur über HTTPS ausliefern (middleware/auth.js).
      - COOKIE_SECURE=true
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-lax}
      # HSTS-Header setzen (server.js). Nur sinnvoll, wenn TLS wirklich steht –
      # ein verfrühtes HSTS sperrt Besucher bei einem Zertifikatsfehler aus.
      - ENABLE_HSTS=true
      # Der Proxy setzt X-Forwarded-For; ohne das ist req.ip die Container-IP
      # und die Anmeldedrosselung greift am falschen Schlüssel.
      - TRUST_PROXY=${TRUST_PROXY:-1}
      # Öffentliche Registrierung gehört in den Control Plane. Bis dahin nur
      # auf Einladung (auth.js wertet 'invite-only' aus).
      - REGISTRATION_MODE=${REGISTRATION_MODE:-invite-only}
      - REQUIRE_EMAIL_VERIFICATION=true
      - CORS_ORIGIN=${CORS_ORIGIN:?CORS_ORIGIN muss die echte Adresse sein, z. B. https://app.solooffice.de}
      # Interne Control-Plane-Schnittstelle (AP-4.4). Ohne Geheimnis
      # antworten die Endpunkte mit 503; der Pfad `/internal/` wird vom
      # Reverse-Proxy nicht nach außen durchgereicht.
      # Siehe docs/control-plane-internal-api.md.
      - CONTROL_PLANE_INTERNAL_SECRET=${CONTROL_PLANE_INTERNAL_SECRET:-}
      - CONTROL_PLANE_INTERNAL_TIMESTAMP_TOLERANCE_SECONDS=${CONTROL_PLANE_INTERNAL_TIMESTAMP_TOLERANCE_SECONDS:-300}
      - CONTROL_PLANE_INTERNAL_RATE_LIMIT_MAX=${CONTROL_PLANE_INTERNAL_RATE_LIMIT_MAX:-60}
      - APP_BASE_URL=${APP_BASE_URL:-}
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-1g}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  database:
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-1g}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    # Im gehosteten Betrieb terminiert ein Reverse-Proxy TLS. Der Container
    # darf deshalb NICHT direkt am öffentlichen Interface hängen – nur an
    # Loopback, damit der Proxy ihn erreicht und sonst niemand.
    # `!override` ersetzt die Portliste der Basisdatei. Ohne den Tag hängt
    # Compose beide Einträge aneinander (0.0.0.0:PORT und 127.0.0.1:PORT), und
    # der Start scheitert mit „port is already allocated“ – oder schlimmer, der
    # Port bleibt öffentlich. Braucht Docker Compose v2.24 oder neuer.
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
