# nginx-Konfiguration für den Demo-Betrieb (statisches Bundle, kein Backend).
#
# Unterschied zu nginx.conf: Der `/api/`-Block fehlt bewusst. nginx löst
# literale Upstream-Namen beim Start auf und verweigert den Dienst mit
# "host not found in upstream", wenn es den Host nicht gibt. Da im Demo-Betrieb
# kein Backend existiert, würde der Container mit nginx.conf gar nicht starten.
# Die Demo stellt nachweislich null API-Anfragen – alles läuft über localStorage.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Die Demo lädt nichts hoch – kleine Bodies genügen.
    client_max_body_size 1M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Für die Bereitschaftsprüfung im Deploy-Schritt.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Ohne diese Regel greift ein Update nicht durch: Der Browser behielte die
    # alte index.html und lüde damit weiter die alten, gehashten Chunk-Namen.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        expires off;
    }

    # Vite vergibt gehashte Dateinamen – dieselbe URL liefert nie anderen Inhalt.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Übrige statische Dateien (Favicon, Bilder) moderat cachen.
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
    }

    # Die Anwendung nutzt Hash-Routing; jeder Pfad landet auf der index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
