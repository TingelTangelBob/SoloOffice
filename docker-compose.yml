services:
  database:
    image: postgres:15-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-solooffice}-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solooffice}
      POSTGRES_USER: ${POSTGRES_USER:-solooffice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in der Instanz-Umgebung gesetzt sein}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solooffice} -d ${POSTGRES_DB:-solooffice}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-solooffice}-backend
    env_file:
      - .env.backend.${INSTANCE_NAME:-default}
    environment:
      # Override specific container networking settings
      - DB_HOST=database
      - DB_PORT=5432
      # Fallback environment variables if env_file doesn't exist
      - PORT=3001
      - NODE_ENV=production
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8080}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-lax}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - LOG_LEVEL=${LOG_LEVEL:-WARN}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - REGISTRATION_MODE=${REGISTRATION_MODE:-closed-after-first}
      - REQUIRE_EMAIL_VERIFICATION=${REQUIRE_EMAIL_VERIFICATION:-false}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY muss in der Instanz-Umgebung gesetzt sein}
      # SMTP Configuration
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-}
    expose:
      - "3001"
    volumes:
      - backups_data:/backups
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    container_name: ${COMPOSE_PROJECT_NAME:-solooffice}-frontend
    environment:
      - NODE_ENV=production
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    
volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-solooffice}_postgres_data
  backups_data:
    name: ${COMPOSE_PROJECT_NAME:-solooffice}_backups_data

networks:
  app-network:
    name: ${COMPOSE_PROJECT_NAME:-solooffice}_network
    driver: bridge
