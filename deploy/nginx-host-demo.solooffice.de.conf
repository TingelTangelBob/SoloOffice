# vhost für den Host-nginx auf dem Hetzner-Server (nicht für den Container!)
#
# Der Server terminiert TLS bereits selbst mit nginx 1.24 und certbot; alle
# Dienste dort laufen im Container auf 127.0.0.1 und werden von hier
# durchgereicht (so wie chat.bp-digital.de, n8n.bp-digital.de usw.).
# Die Demo fügt sich in genau dieses Muster ein.
#
# Einrichtung auf dem Server:
#   1. Datei nach /etc/nginx/sites-available/demo.solooffice.de kopieren
#   2. ln -s /etc/nginx/sites-available/demo.solooffice.de /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#   4. certbot --nginx -d demo.solooffice.de
#      (certbot ergänzt die listen-443-Direktiven und die Zertifikatspfade selbst)
#
# Voraussetzung: DNS-Einträge A und AAAA auf diesen Server zeigen bereits,
# sonst schlägt die Zertifikatsausstellung fehl.

server {
    listen 80;
    listen [::]:80;
    server_name demo.solooffice.de;

    # certbot ersetzt diesen Block nach dem ersten Lauf durch eine Weiterleitung
    # auf HTTPS und legt einen eigenen 443-Block an.

    # Zugriffe getrennt protokollieren, damit die Demo-Nutzung sichtbar ist,
    # ohne die Protokolle der Nachbarprojekte zu vermischen.
    access_log /var/log/nginx/demo.solooffice.de.access.log;
    error_log  /var/log/nginx/demo.solooffice.de.error.log;

    # Die Demo ist eine reine Vorführung und soll nicht ranken – sonst
    # konkurriert sie in der Suche mit der Marketingseite.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Sicherheitskopfzeilen. Der Container setzt eigene; doppelte Angaben sind
    # unschädlich, aber hier steht die für Suchmaschinen relevante Zeile.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        # Zielport siehe DEMO_PORT in docker-compose.demo.yml (Standard 8081).
        # Belegt sind auf dieser Maschine bereits 4000, 5432, 5678 und 8065.
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Die Demo hält allen Zustand im Browser; es gibt keine langen
        # Serverantworten, deshalb knappe Zeitlimits.
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
