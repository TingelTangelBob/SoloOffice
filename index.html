<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/SoloOffice_Icon.png" />
    <link rel="apple-touch-icon" href="/SoloOffice_Icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SoloOffice-Demo – Rechnungen, Angebote, EÜR und Belege ausprobieren. Die Testdaten bleiben in diesem Browser." />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="application-name" content="SoloOffice-Demo" />
    <meta name="msapplication-TileColor" content="#2563eb" />
    <meta name="msapplication-TileImage" content="/SoloOffice_Icon.png" />
    <title>SoloOffice-Demo – Rechnungs- und Geschäftsverwaltung</title>
    <script>
      (() => {
        try {
          const raw = localStorage.getItem('solooffice-theme-prepaint-v1');
          const snapshot = raw ? JSON.parse(raw) : null;
          if (!snapshot || (snapshot.theme !== 'light' && snapshot.theme !== 'dark')) return;
          const root = document.documentElement;
          const theme = snapshot.mode === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : snapshot.theme;
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
          root.style.backgroundColor = theme === 'dark' ? '#0a0a0b' : '#f6f6f7';
          for (const name of ['--primary-color', '--primary-light', '--primary-medium', '--primary-text-color', '--secondary-color', '--secondary-light', '--secondary-text-color', '--primary-on-surface', '--accent-tint', '--accent-edge']) {
            if (typeof snapshot[name] === 'string') root.style.setProperty(name, snapshot[name]);
          }
        } catch {
          // Ein beschädigter optionaler Snapshot darf den App-Start nicht blockieren.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
